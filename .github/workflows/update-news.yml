name: Update News

on:
  # GitHub Actions内蔵のschedule機能は実測で1〜2.7時間程度遅延することが分かったため廃止。
  # 代わりに外部の定期実行サービス（cron-job.org）から、狙った時刻（8:45・11:57・17:45 JST）に
  # 下記のworkflow_dispatchをAPI経由で呼び出す方式に切り替えている。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check docs
        run: python check_docs.py

      - name: Fetch news and generate HTML
        run: python main.py --quiet

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
