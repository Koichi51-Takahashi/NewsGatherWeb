name: Update News

on:
  schedule:
    # 毎日8:45・11:57・17:45 JST に実行
    # JST は UTC-9 のため、前日23:45・2:57・8:45 UTC に設定
    - cron: '45 23 * * *'  # 8:45 JST (前日)
    - cron: '57 2 * * *'   # 11:57 JST
    - cron: '45 8 * * *'   # 17:45 JST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch news and generate HTML
        run: python main.py --quiet

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
