name: Update News

on:
  schedule:
    # GitHub Actions のスケジュール実行は実測で1〜2.7時間程度遅延することが分かったため、
    # 表示上の目標時刻（8:45・11:57・17:45 JST）より前倒しした時刻を設定している。
    # 設定時刻: 7:05・11:05・16:35 JST（JST は UTC+9 のため、前日22:05・2:05・7:35 UTC）
    - cron: '5 22 * * *'   # 7:05 JST (前日)
    - cron: '5 2 * * *'    # 11:05 JST
    - cron: '35 7 * * *'   # 16:35 JST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch news and generate HTML
        run: python main.py --quiet

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
