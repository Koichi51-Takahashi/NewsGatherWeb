# lint（書き方の自動点検）の設定。使い方は README.md の「文書チェックとlint」を参照。

[tool.ruff]
# 動作確認しているPythonのうち、古い方（ローカル3.11 / GitHub Actions 3.12）
target-version = "py311"

[tool.ruff.lint]
# F:未使用importや未定義名などのうっかりミス / E4,E7,E9:基本的な書き方の誤り
# I:importの並び順 / BLE:何でも握りつぶす except Exception の検出
# E501（行の長さ）は日本語コメントが長くなりやすいため選ばない
select = ["F", "E4", "E7", "E9", "I", "BLE"]

[tool.pymarkdown]
# MD013（1行の長さ上限）：日本語の説明文や表は長くなるため無効にする
plugins.md013.enabled = false
# MD024（同じ見出しの重複禁止）：7-1と7-2のように、親の見出しが違えば同名の小見出しを許す
plugins.md024.siblings_only = true
